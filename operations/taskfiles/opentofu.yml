version: "3"

tasks:
  tofu:
    desc: Run any OpenTofu command for a stack
    vars:
      stack_dir: infrastructure/opentofu/stacks/{{.stack}}
    dir: "{{.stack_dir}}"
    cmds:
      - "{{.ROOT_DIR}}/operations/scripts/tofu.sh {{.ROOT_DIR}}/secrets/infrastructure.sops.yaml {{.CLI_ARGS}}"

  cluster:plan:
    desc: Plan the Kubernetes cluster stack
    cmds:
      - task: tofu
        vars:
          stack: clusters/prod-k8s
          CLI_ARGS: plan

  cluster:init:
    desc: Initialize the Kubernetes cluster OpenTofu stack
    cmds:
      - task: tofu
        vars:
          stack: clusters/prod-k8s
          CLI_ARGS: init

  cluster:apply:
    desc: Apply the Kubernetes cluster stack
    cmds:
      - task: tofu
        vars:
          stack: clusters/prod-k8s
          CLI_ARGS: apply

  cluster:destroy:
    desc: Destroy the Kubernetes cluster stack
    cmds:
      - task: tofu
        vars:
          stack: clusters/prod-k8s
          CLI_ARGS: destroy
